name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q
      - run: uv run subscout build . --out _site
      - run: test -z "$(python3 -c 'import json;r=json.load(open("_site/build-report.json"));print("\n".join(r["warnings"]))')" || (echo "build warnings:"; python3 -c 'import json;print("\n".join(json.load(open("_site/build-report.json"))["warnings"]))'; exit 1)
